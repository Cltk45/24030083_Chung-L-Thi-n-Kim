<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu | Chung Lê Thiên Kim</title>
  <style>
    :root { color-scheme: light; --ink: #202421; --muted: #727a74; --line: #e5e9e5; --accent: #557b68; --paper: #fff; --wash: #f5f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; background: var(--wash); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 58px); background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); line-height: 1.12; letter-spacing: -.04em; }
    .rule { height: 1px; margin: 30px 0 8px; background: var(--line); }
    dl { margin: 0; }
    .item { display: grid; grid-template-columns: minmax(130px, 1fr) 2fr; gap: 18px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    dt { color: var(--muted); font-size: 14px; }
    dd { margin: 0; font-size: 16px; font-weight: 600; }
    @media (max-width: 480px) { .item { grid-template-columns: 1fr; gap: 7px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Giới thiệu</p>
    <h1>Chung Lê Thiên Kim</h1>
    <div class="rule"></div>
    <dl>
      <div class="item"><dt>Họ và tên</dt><dd>Chung Lê Thiên Kim</dd></div>
      <div class="item"><dt>Chuyên ngành</dt><dd>Truyền thông đa phương tiện</dd></div>
      <div class="item"><dt>Kỹ năng</dt><dd>Edit</dd></div>
      <div class="item"><dt>Mục tiêu nghề nghiệp</dt><dd>Editor</dd></div>
    </dl>
  </main>
</body>
</html>
